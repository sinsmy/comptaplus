<script>
  // Désactive TOUS les service workers existants (force la purge du cache)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
    caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  }
</script>

<div id="auth-screen" class="screen">

    <form id="login-form" class="auth-form">
      <label>Email<input type="email" id="login-email" required autocomplete="email" placeholder="vous@exemple.com"></label>

      <button type="submit" class="btn-primary">Se connecter</button>
      <p class="auth-error" id="login-error"></p>
    </form>

    <form id="signup-form" class="auth-form hidden">
      <label>Nom complet<input type="text" id="signup-name" required placeholder="Jean Baptiste"></label>
      <label>Email<input type="email" id="signup-email" required autocomplete="email" placeholder="vous@exemple.com"></label>
      <label>Mot de passe (6 min.)<input type="password" id="signup-pass" required minlength="6" autocomplete="new-password" placeholder="••••••••"></label>
      <button type="submit" class="btn-primary">Créer mon compte</button>
      <p class="auth-error" id="signup-error"></p>
    </form>
  </div>
</div>
